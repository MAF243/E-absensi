version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: eabsensi_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: eabsensi_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT:-5000}
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: eabsensi_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
